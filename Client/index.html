<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>晋鑫设备管理系统</title>
    <style>
      /* 启动加载动画：Vue 挂载前（含首次路由导航/懒加载）的占位画面，挂载后整体被替换 */
      html, body { height: 100%; }
      body { margin: 0; }
      #root { height: 100%; }
      .boot-loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        color: #64748b; background: #f1f5f9;
      }
      .boot-spinner {
        width: 32px; height: 32px;
        border: 3px solid #cbd5e1; border-top-color: #0ea5e9;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        .boot-loading { color: #94a3b8; background: #0b1220; }
        .boot-spinner { border-color: #334155; border-top-color: #38bdf8; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading">
        <div class="boot-spinner"></div>
        <div>系统加载中…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
