<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030d22" />
      <stop offset="50%" stop-color="#0a1931" />
      <stop offset="100%" stop-color="#021233" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Violet Glow Gradient -->
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Filter for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="8 8" opacity="0.6" />

  <!-- Industrial SCADA Gauge Ring (Outer Arc) -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyanGlow)" stroke-width="10" stroke-linecap="round" stroke-dasharray="720 280" transform="rotate(-135 256 256)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" stroke-dasharray="240 760" transform="rotate(75 256 256)" opacity="0.5" />

  <!-- Gauge Tick Marks -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.75">
    <line x1="256" y1="98" x2="256" y2="114" />
    <line x1="144" y1="144" x2="156" y2="156" />
    <line x1="98" y1="256" x2="114" y2="256" />
    <line x1="368" y1="144" x2="356" y2="156" />
    <line x1="414" y1="256" x2="398" y2="256" />
  </g>

  <!-- Circuit Trace Lines & Telemetry Nodes -->
  <g stroke="url(#cyanGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 120 256 L 165 256 L 195 226" fill="none" />
    <path d="M 392 256 L 347 256 L 317 286" fill="none" />
    <path d="M 256 392 L 256 347 L 226 317" fill="none" />
  </g>
  <!-- Node Dots -->
  <circle cx="120" cy="256" r="6" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="392" cy="256" r="6" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="256" cy="392" r="6" fill="#10b981" filter="url(#glow)" />

  <!-- Inner High-Tech Gear (SCADA/HMI Industrial Automation Core) -->
  <g transform="translate(256, 256)">
    <!-- Gear Teeth -->
    <path d="
      M -20 -90 L 20 -90 L 26 -76 L 54 -83 L 74 -51 L 54 -38 L 74 -16 L 90 -20 L 90 20 L 74 16 L 54 38 L 74 51 L 54 83 L 26 76 L 20 90 L -20 90 L -26 76 L -54 83 L -74 51 L -54 38 L -74 16 L -90 20 L -90 -20 L -74 -16 L -54 -38 L -74 -51 L -54 -83 L -26 -76 Z
    " fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linejoin="round" opacity="0.9" />

    <!-- Central Telemetry Hub -->
    <circle cx="0" cy="0" r="54" fill="#030d22" stroke="url(#emeraldGlow)" stroke-width="6" filter="url(#glow)" />

    <!-- Pulse Core & Indicator -->
    <circle cx="0" cy="0" r="32" fill="url(#cyanGlow)" opacity="0.2" />
    <circle cx="0" cy="0" r="20" fill="url(#cyanGlow)" />
    
    <!-- Digital Sweep Hand / Needle -->
    <line x1="0" y1="0" x2="68" y2="-68" stroke="#10b981" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />
    <circle cx="68" cy="-68" r="4" fill="#ffffff" />
  </g>

  <!-- Live Status LED at top -->
  <circle cx="256" cy="76" r="7" fill="#10b981" filter="url(#glow)" />
</svg>
